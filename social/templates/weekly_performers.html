<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0a0e1a;
    --surface:  #141824;
    --text:     #ffffff;
    --muted:    #8892a4;
    --green:    #00e676;
    --red:      #ff5252;
    --amber:    #ffab40;
    --border:   rgba(136,146,164,0.15);
  }

  html, body {
    width: 1080px; height: 1080px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* ── Grid texture ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(136,146,164,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(136,146,164,0.04) 1px, transparent 1px);
    background-size: 54px 54px;
    pointer-events: none;
  }

  .wrap {
    display: flex;
    flex-direction: column;
    width: 1080px;
    height: 1080px;
    padding: 0;
    position: relative;
  }

  /* ── Top bar ── */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 32px 48px 24px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .logo span { color: var(--green); }
  .week-label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* ── Headline ── */
  .headline {
    padding: 40px 48px 28px;
  }
  .headline-main {
    font-size: 56px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--text);
    text-transform: uppercase;
  }
  .headline-sub {
    font-size: 34px;
    font-weight: 700;
    color: var(--green);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 4px;
  }

  /* ── Player list ── */
  .players {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0;
    padding: 0 48px;
  }

  .player-row {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 18px 24px;
    border-radius: 12px;
    margin-bottom: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .player-row::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--green);
    border-radius: 3px 0 0 3px;
  }

  .rank {
    font-size: 28px;
    font-weight: 900;
    color: var(--green);
    width: 36px;
    text-align: center;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .player-info {
    flex: 1;
    min-width: 0;
  }
  .player-name-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .player-name {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .player-team {
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    flex-shrink: 0;
  }
  .player-cats {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .player-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    flex-shrink: 0;
  }
  .pv-score {
    font-size: 32px;
    font-weight: 800;
    color: var(--green);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .fa-badge {
    background: rgba(0,230,118,0.15);
    border: 1px solid rgba(0,230,118,0.35);
    color: var(--green);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 4px;
  }

  /* ── Bottom bar ── */
  .bottom-bar {
    padding: 20px 48px 28px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .site-url {
    font-size: 15px;
    font-weight: 600;
    color: var(--green);
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- Top bar -->
  <div class="top-bar">
    <div class="logo">ROTO<span>INTEL</span></div>
    <div class="week-label">WEEK OF {{ week_label }}</div>
  </div>

  <!-- Headline -->
  <div class="headline">
    <div class="headline-main">BEST OF THE WEEK</div>
    <div class="headline-sub">PROJECTED PERFORMERS</div>
  </div>

  <!-- Players -->
  <div class="players">
    {% for p in players %}
    <div class="player-row">
      <div class="rank">{{ loop.index }}</div>
      <div class="player-info">
        <div class="player-name-row">
          <div class="player-name">{{ p.name }}</div>
          <div class="player-team">{{ p.team }}</div>
        </div>
        <div class="player-cats">{{ p.top_cats }}</div>
      </div>
      <div class="player-right">
        <div class="pv-score">{{ "%.1f"|format(p.period_value or 0) }}</div>
        {% if p.is_fa %}<div class="fa-badge">FA AVAILABLE</div>{% endif %}
      </div>
    </div>
    {% endfor %}
  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <div class="site-url">rotointel.com</div>
  </div>
</div>
</body>
</html>
