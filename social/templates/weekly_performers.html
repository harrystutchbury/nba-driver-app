<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0a0e1a;
    --surface:  #141824;
    --text:     #ffffff;
    --muted:    #8892a4;
    --green:    #00e676;
    --border:   rgba(136,146,164,0.15);
  }

  html, body {
    width: 1080px; height: 1080px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(136,146,164,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(136,146,164,0.04) 1px, transparent 1px);
    background-size: 54px 54px;
    pointer-events: none;
  }

  .wrap {
    display: flex;
    flex-direction: column;
    width: 1080px;
    height: 1080px;
  }

  /* ── Top bar ── */
  .top-bar {
    display: flex;
    align-items: center;
    padding: 28px 48px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-ball { font-size: 20px; line-height: 1; }
  .logo span { color: var(--green); }

  /* ── Headline ── */
  .headline {
    padding: 28px 48px 20px;
    flex-shrink: 0;
  }
  .headline-main {
    font-size: 52px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--text);
    text-transform: uppercase;
  }
  .headline-sub {
    font-size: 36px;
    font-weight: 700;
    color: var(--green);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin-top: 2px;
  }
  .headline-date {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 10px;
  }

  /* ── Player list ── */
  .players {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 48px 4px;
    gap: 6px;
    min-height: 0;
  }

  .player-row {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 0 0 20px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
    min-height: 0;
  }
  .player-row::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--green);
    border-radius: 3px 0 0 3px;
  }

  .rank {
    font-size: 20px;
    font-weight: 900;
    color: var(--green);
    width: 28px;
    text-align: center;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    opacity: 0.7;
  }

  .player-left {
    display: flex;
    align-items: center;
    gap: 16px;
    flex: 1;
    min-width: 0;
  }
  .player-name-block {
    min-width: 0;
  }
  .player-name-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .player-name {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .player-team {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    flex-shrink: 0;
  }

  .player-stats {
    display: flex;
    align-items: stretch;
    border-left: 1px solid var(--border);
    flex-shrink: 0;
    align-self: stretch;
  }
  .games-col,
  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-right: 1px solid var(--border);
  }
  .games-col { width: 62px; }
  .stat-item  { width: 88px; }
  .stat-item:last-child { border-right: none; }

  .stat-label,
  .games-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .stat-val {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .games-val {
    font-size: 18px;
    font-weight: 700;
    color: var(--green);
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }

  /* ── Bottom bar ── */
  .bottom-bar {
    padding: 16px 48px 22px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
  }
  .site-url {
    font-size: 14px;
    font-weight: 600;
    color: var(--green);
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- Top bar -->
  <div class="top-bar">
    <div class="logo">
      <span class="logo-ball">🏀</span>
      ROTO<span>INTEL</span>
    </div>
  </div>

  <!-- Headline -->
  <div class="headline">
    <div class="headline-main">BEST PERFORMERS</div>
    <div class="headline-sub">NEXT WEEK</div>
    <div class="headline-date">{{ date_range }}</div>
  </div>

  <!-- Players -->
  <div class="players">
    {% for p in players %}
    <div class="player-row">
      <div class="player-left">
        <div class="rank">{{ loop.index }}</div>
        <div class="player-name-block">
          <div class="player-name-row">
            <div class="player-name">{{ p.name }}</div>
            <div class="player-team">{{ p.team }}</div>
          </div>
        </div>
      </div>
      <div class="player-stats">
        <div class="games-col">
          <div class="games-label">GP</div>
          <div class="games-val">{{ p.games }}</div>
        </div>
        {% for s in p.stats %}
        <div class="stat-item">
          <div class="stat-label">{{ s.label }}</div>
          <div class="stat-val">{{ s.value }}</div>
        </div>
        {% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <div class="site-url">rotointel.com</div>
  </div>
</div>
</body>
</html>
