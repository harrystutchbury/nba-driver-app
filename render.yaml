services:
  - type: web
    name: nba-driver
    runtime: python
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt &&
      cd ../frontend && npm install && npm run build
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: nba-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NBA_DB_PATH
        value: /data/nba.db
      - key: MODELS_DIR
        value: /data/models
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: roto-intel-social
    runtime: python
    rootDir: social
    buildCommand: pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.playwright playwright install --with-deps chromium
    startCommand: PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.playwright uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.playwright
      - key: ROTO_INTEL_API_BASE_URL
        value: https://app.rotointel.com
      - key: ROTO_INTEL_JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BUFFER_ACCESS_TOKEN
        sync: false
      - key: BUFFER_ORG_ID
        sync: false
      - key: BUFFER_CHANNEL_X
        sync: false
      - key: BUFFER_CHANNEL_IG
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: roto-intel-landing
    runtime: static
    rootDir: landing
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
