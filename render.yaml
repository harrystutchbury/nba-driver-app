services:
  - type: web
    name: nba-driver
    runtime: python
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt &&
      cd ../frontend && npm install && npm run build
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: nba-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NBA_DB_PATH
        value: /data/nba.db
      - key: MODELS_DIR
        value: /data/models
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: roto-intel-social
    runtime: python
    rootDir: social
    buildCommand: pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.playwright playwright install --with-deps chromium
    startCommand: PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.playwright uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.playwright
      - key: TWITTER_API_KEY
        sync: false
      - key: TWITTER_API_SECRET
        sync: false
      - key: TWITTER_ACCESS_TOKEN
        sync: false
      - key: TWITTER_ACCESS_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: ROTO_INTEL_API_BASE_URL
        sync: false
      - key: ROTO_INTEL_JWT_SECRET
        sync: false

  - type: web
    name: roto-intel-landing
    runtime: static
    rootDir: landing
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
